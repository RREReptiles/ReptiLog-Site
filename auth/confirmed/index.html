<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed | ReptiLog</title>
  <meta name="description" content="Your ReptiLog account is ready. Return to the app and sign in." />
  <style>
    :root {
      color-scheme: dark;
      --parchment: #e2dcca;
      --parchment-muted: rgba(226, 220, 202, 0.62);
      --parchment-soft: rgba(226, 220, 202, 0.38);
      --crimson: #9e1403;
      --crimson-light: #c41804;
      --surface: #111111;
      --surface-2: #1a1a1a;
      --surface-3: #222222;
      --border-subtle: #2a2a2a;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at top, rgba(158, 20, 3, 0.24) 0%, transparent 52%),
        radial-gradient(circle at bottom right, rgba(158, 20, 3, 0.12) 0%, transparent 34%),
        var(--surface);
      color: var(--parchment);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(226, 220, 202, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent 82%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(226, 220, 202, 0.10);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(26, 26, 26, 0.98) 0%, rgba(31, 11, 9, 0.92) 100%);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.42),
        0 0 44px rgba(158, 20, 3, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .card-inner { padding: 34px 24px 28px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      color: var(--parchment);
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.30);
    }

    .brand span span { color: var(--crimson-light); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 6px 12px;
      border: 1px solid rgba(158, 20, 3, 0.34);
      border-radius: 999px;
      background: rgba(158, 20, 3, 0.11);
      color: #d65342;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--crimson-light);
      box-shadow: 0 0 14px rgba(196, 24, 4, 0.65);
    }

    h1 {
      margin: 0;
      color: var(--parchment);
      font-size: clamp(2.25rem, 11vw, 4.35rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 900;
    }

    .body-copy {
      margin: 18px 0 0;
      color: var(--parchment-muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .actions { margin-top: 30px; }

    .button {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--crimson);
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(158, 20, 3, 0.30);
      transition: background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--crimson-light);
      transform: translateY(-1px);
      box-shadow: 0 18px 42px rgba(158, 20, 3, 0.38);
      outline: none;
    }

    .button:focus-visible { box-shadow: 0 0 0 4px rgba(196, 24, 4, 0.30), 0 18px 42px rgba(158, 20, 3, 0.38); }

    .fallback-note {
      margin: 18px 0 0;
      color: var(--parchment-soft);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .footer-note {
      margin: 18px 0 0;
      color: rgba(226, 220, 202, 0.22);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (min-width: 520px) {
      .card-inner { padding: 44px 42px 36px; }
      .button { width: auto; min-width: 190px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <section class="card">
      <div class="card-inner">
        <a class="brand" href="/" aria-label="ReptiLog home">
          <img src="../../images/app_Icon.png" alt="" />
          <span>Repti<span>Log</span></span>
        </a>

        <div class="badge" aria-label="Account status">
          <span class="badge-dot" aria-hidden="true"></span>
          Account ready
        </div>

        <h1 id="page-title">Email confirmed</h1>
        <p class="body-copy">Your ReptiLog account is ready. You can return to the app and sign in.</p>

        <div class="actions">
          <a class="button" href="reptilog://auth-callback">Open ReptiLog</a>
        </div>

        <p class="fallback-note">If the button does not open the app, close this page and open ReptiLog manually.</p>
      </div>
    </section>
    <p class="footer-note">Professional Herpetoculture Management</p>
  </main>
</body>
</html>
